# Собирает ContourBot под Windows на каждый push и pull request.
# Если запушить тег вида v1.1.0, готовый zip сам прикрепится к релизу на GitHub.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ContourBot | Out-Null
          Copy-Item build/Release/ContourBot.exe dist/ContourBot/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/ContourBot/ContourBot.exe
          Copy-Item README.md, LICENSE dist/ContourBot/
          Copy-Item -Recurse examples dist/ContourBot/examples
          $name = "ContourBot-windows-x64"
          if ($env:GITHUB_REF -like "refs/tags/*") { $name = "ContourBot-$($env:GITHUB_REF_NAME)-windows-x64" }
          Compress-Archive -Path dist/ContourBot/* -DestinationPath "dist/$name.zip"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}.zip
